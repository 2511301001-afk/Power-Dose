services:
  # Backend API Service (FastAPI + Python)
  - type: web
    name: powerdose-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DB_NAME
        value: powerdose_db
      - key: PYTHONPATH
        value: .

  # Frontend Web App (React + Vite Static Site)
  - type: static
    name: powerdose-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: powerdose-backend
          property: url
